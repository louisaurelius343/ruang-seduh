<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Ruang Seduh</title>
<style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#30231c;background:#f8f3e9}section{background:#fffdf8;padding:1.25rem;margin:1rem 0;border-radius:12px}label{display:block;margin:.7rem 0}input,textarea,select{padding:.55rem;width:100%;max-width:500px;box-sizing:border-box}button{padding:.6rem 1rem;cursor:pointer;margin:.25rem}.error{color:#a22}.muted{color:#776}.row{border-top:1px solid #ddd;padding:.8rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}</style></head>
<body><h1>Ruang Seduh · Admin</h1><p id="message" class="error"></p>
<section id="login"><h2>Login</h2><form id="login-form"><label>Username <input name="username" required autocomplete="username"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><button>Masuk</button></form></section>
<main id="panel" hidden><p>Login sebagai <strong id="who"></strong> <button id="logout">Keluar</button></p>
<section><h2>Produk</h2><form id="product-form"><input type="hidden" name="id"><label>Nama <input name="name" required></label><label>Harga <input name="price" type="number" min="1" step="1" required></label><label>Asal <input name="origin"></label><label>Catatan <input name="notes"></label><label>Tipe <input name="type"></label><label>Emoji <input name="emoji"></label><label>Tag <input name="tag"></label><label>Warna <input name="color"></label><label>Aktif <select name="active"><option value="1">Ya</option><option value="0">Tidak</option></select></label><button>Simpan produk</button><button type="button" id="clear-product">Kosongkan</button></form><div id="products" class="grid"></div></section>
<section><h2>Pesanan</h2><div id="orders"></div></section></main>
<script>
const $=id=>document.getElementById(id), message=text=>{$('message').textContent=text||''};
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.message||`HTTP ${r.status}`);return data}
function text(tag,value){const node=document.createElement(tag);node.textContent=value??'';return node}
async function boot(){try{const me=await api('/api/admin/me');$('login').hidden=true;$('panel').hidden=false;$('who').textContent=me.username;await Promise.all([loadProducts(),loadOrders()])}catch{}}
async function login(e){e.preventDefault();const f=new FormData(e.target);try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});e.target.reset();message('');await boot()}catch(err){message(err.message)}}
async function loadProducts(){const items=await api('/api/admin/products');const box=$('products');box.replaceChildren();for(const p of items){const row=document.createElement('div');row.className='row';row.append(text('strong',`${p.name} · Rp${p.price.toLocaleString('id-ID')}`),text('span',` — ${p.active?'aktif':'nonaktif'}`));const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>fillProduct(p);row.append(edit);box.append(row)}}
function fillProduct(p){const f=$('product-form');for(const key of ['id','name','price','origin','notes','type','emoji','tag','color','active'])f.elements[key].value=p[key]??'';window.scrollTo({top:0,behavior:'smooth'})}
async function saveProduct(e){e.preventDefault();const f=new FormData(e.target);const body={name:f.get('name'),price:Number(f.get('price')),origin:f.get('origin'),notes:f.get('notes'),type:f.get('type'),emoji:f.get('emoji'),tag:f.get('tag'),color:f.get('color'),active:Number(f.get('active'))};try{const id=f.get('id');await api(id?`/api/admin/products/${id}`:'/api/admin/products',{method:id?'PATCH':'POST',body:JSON.stringify(body)});message('Produk tersimpan.');e.target.reset();await loadProducts()}catch(err){message(err.message)}}
async function loadOrders(){const orders=await api('/api/admin/orders');const box=$('orders');box.replaceChildren();for(const o of orders){const row=document.createElement('div');row.className='row';row.append(text('strong',`#${o.id} · ${o.customer_name} · Rp${o.total.toLocaleString('id-ID')}`),text('p',`HP: ${o.phone}`),text('p',`Catatan: ${o.note}`),text('p',`Item: ${o.items.map(i=>`${i.name} × ${i.quantity}`).join(', ')}`));const select=document.createElement('select');for(const s of ['baru','diproses','selesai','dibatalkan']){const option=document.createElement('option');option.value=s;option.textContent=s;option.selected=s===o.status;select.append(option)}select.onchange=async()=>{try{await api(`/api/admin/orders/${o.id}/status`,{method:'PATCH',body:JSON.stringify({status:select.value})});message('Status diperbarui.')}catch(err){message(err.message)}};row.append(text('span',' Status: '),select);box.append(row)}}
$('login-form').onsubmit=login;$('product-form').onsubmit=saveProduct;$('clear-product').onclick=()=>$('product-form').reset();$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};boot();
</script></body></html>
