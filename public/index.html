<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ruang Seduh · Cari kafe terdekat</title>
  <meta name="description" content="Temukan kafe dan tempat nongkrong terdekat. Data dari OpenStreetMap.">
  <meta name="theme-color" content="#30231c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">ruang<span>.</span>seduh</a>
    <form id="search" class="search" role="search">
      <input id="q" type="search" placeholder="Cari area, mis. Dago Bandung" aria-label="Cari area atau kota" autocomplete="off">
      <button type="submit" class="btn">Cari</button>
    </form>
    <button id="locate" class="btn primary" type="button">📍 Di sekitarku</button>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="controls">
        <div class="chips" role="group" aria-label="Kategori">
          <label class="chip"><input type="checkbox" name="cat" value="kafe" checked> ☕ Kafe</label>
          <label class="chip"><input type="checkbox" name="cat" value="makan"> 🍜 Tempat makan</label>
        </div>
        <div class="row">
          <label>Radius
            <select id="radius">
              <option value="1000">1 km</option>
              <option value="2000" selected>2 km</option>
              <option value="5000">5 km</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="openNow"> Buka sekarang</label>
          <label class="check"><input type="checkbox" id="wifiOnly"> Ada WiFi</label>
          <label class="check"><input type="checkbox" id="favOnly"> ★ Favorit</label>
        </div>
      </div>
      <p id="status" class="status" aria-live="polite">Tekan <b>Di sekitarku</b> atau cari sebuah area untuk mulai.</p>
      <ol id="list" class="list"></ol>
    </aside>
    <section class="map-wrap" aria-label="Peta">
      <div id="map"></div>
    </section>
  </main>

  <footer class="foot">
    Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>.
    Jam buka & info bisa belum lengkap. · <a href="https://github.com/louisaurelius343/ruang-seduh" target="_blank" rel="noopener">Kode</a>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
